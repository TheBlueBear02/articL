<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- Generated by scripts/make-audio.ts: window.__CAPTIONS = { duration, words[] } -->
    <script src="assets/words.js"></script>
    <style>
      :root {
        --ground: #0b0b0f;
        --ink: #ffffff;
        --accent: #ffd60a;
        --font-display: "Montserrat", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-display);
      }
      #broll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 40%;
      }
      /* Darken the bottom so captions stay readable on any photo. */
      #scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.7) 42%, rgba(0, 0, 0, 0.7) 66%, rgba(0, 0, 0, 0.25) 80%, rgba(0, 0, 0, 0.1) 100%);
      }
      #captions {
        position: absolute;
        left: 140px;
        right: 140px;
        top: 820px;
        height: 360px;
      }
      .chunk {
        position: absolute;
        inset: 0;
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        gap: 0 28px;
        visibility: hidden;
      }
      .word {
        display: inline-block;
        color: var(--ink);
        font-size: 84px;
        font-weight: 800;
        line-height: 1.1;
        text-transform: uppercase;
        letter-spacing: -0.01em;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6.7"
      data-width="1080"
      data-height="1920"
    >
      <img id="broll" class="clip" src="assets/broll.jpg" alt="" data-start="0" data-duration="6.7" data-track-index="0" />
      <div id="scrim" class="clip" data-start="0" data-duration="6.7" data-track-index="1"></div>
      <div id="captions" class="clip" data-start="0" data-duration="6.7" data-track-index="2"></div>
      <audio id="voice" src="assets/voice.mp3" data-start="0" data-duration="5.98" data-track-index="3"></audio>
    </div>
    <script>
      const { duration, words } = window.__CAPTIONS;
      const MAX_WORDS_PER_CHUNK = 3;
      const PAUSE_BREAK = 0.35; // a silence this long starts a new caption chunk

      // Group words into short Reels-style chunks.
      const chunks = [];
      words.forEach((w, i) => {
        const current = chunks[chunks.length - 1];
        const pause = i > 0 ? w.start - words[i - 1].end : 0;
        if (!current || current.length >= MAX_WORDS_PER_CHUNK || pause > PAUSE_BREAK) {
          chunks.push([w]);
        } else {
          current.push(w);
        }
      });
      // Don't leave a lone word as the final caption: fold it into the chunk before it.
      if (chunks.length > 1 && chunks[chunks.length - 1].length === 1) {
        chunks[chunks.length - 2].push(...chunks.pop());
      }
      const filmEnd = Number(document.getElementById("root").dataset.duration);

      const tl = gsap.timeline({ paused: true });
      const captions = document.getElementById("captions");

      chunks.forEach((chunk, ci) => {
        const el = document.createElement("div");
        el.className = "chunk";
        captions.appendChild(el);

        const start = chunk[0].start;
        // Hold each chunk until the next one starts; the last one stays to the end of the film.
        const end = ci + 1 < chunks.length ? chunks[ci + 1][0].start : filmEnd;

        tl.set(el, { visibility: "visible" }, start);
        tl.set(el, { visibility: "hidden" }, end);

        chunk.forEach((w, wi) => {
          const span = document.createElement("span");
          span.className = "word";
          span.textContent = w.word;
          el.appendChild(span);
          // Highlight while spoken. Whisper sometimes returns zero-length words, so keep the
          // highlight until the next word in the chunk starts (the last word holds to its end).
          const next = chunk[wi + 1];
          const off = Math.max(next ? next.start : w.end, w.start + 0.1);
          tl.fromTo(span, { scale: 0.9 }, { scale: 1, duration: 0.12, ease: "back.out(3)" }, w.start);
          tl.set(span, { color: "var(--accent)" }, w.start);
          tl.set(span, { color: "var(--ink)" }, off);
        });
      });

      // Slow Ken Burns push-in on the b-roll across the whole clip.
      tl.fromTo("#broll", { scale: 1.0 }, { scale: 1.15, duration: duration, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
